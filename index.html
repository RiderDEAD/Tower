<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>История Казахстана — Квиз</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;700&family=Golos+Text:wght@400;500&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0e0e11;
    --surface: #16161c;
    --surface2: #1e1e28;
    --border: #2a2a38;
    --accent: #c9a84c;
    --accent2: #e8c96a;
    --text: #eeeae0;
    --muted: #888077;
    --success-bg: #0f2a1a;
    --success-border: #2a7a44;
    --success-text: #5dd68a;
    --fail-bg: #2a0f0f;
    --fail-border: #7a2a2a;
    --fail-text: #e06060;
    --option-hover: #222230;
    --radius: 10px;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Golos Text', sans-serif;
    font-size: 15px;
    min-height: 100vh;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 2rem 1rem;
  }

  .shell {
    width: 100%;
    max-width: 740px;
  }

  .header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 2rem;
    gap: 1rem;
  }

  .header-title {
    font-family: 'Unbounded', sans-serif;
    font-size: 13px;
    font-weight: 600;
    color: var(--accent);
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .score-badge {
    font-family: 'Unbounded', sans-serif;
    font-size: 11px;
    font-weight: 600;
    color: var(--muted);
    letter-spacing: 0.05em;
  }

  .score-badge span {
    color: var(--accent);
  }

  .progress-track {
    height: 3px;
    background: var(--border);
    border-radius: 99px;
    margin-bottom: 2.5rem;
    overflow: hidden;
  }

  .progress-fill {
    height: 3px;
    background: var(--accent);
    border-radius: 99px;
    transition: width 0.4s cubic-bezier(.4,0,.2,1);
  }

  .question-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 2rem;
    margin-bottom: 1.25rem;
  }

  .q-num {
    font-family: 'Unbounded', sans-serif;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.1em;
    color: var(--accent);
    margin-bottom: 0.75rem;
    opacity: 0.8;
  }

  .q-text {
    font-size: 16px;
    font-weight: 500;
    line-height: 1.65;
    color: var(--text);
  }

  .options-grid {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 1.5rem;
  }

  .option-btn {
    display: flex;
    align-items: flex-start;
    gap: 14px;
    width: 100%;
    padding: 14px 18px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    cursor: pointer;
    text-align: left;
    transition: background 0.15s, border-color 0.15s;
    color: var(--text);
    font-family: 'Golos Text', sans-serif;
    font-size: 14px;
    line-height: 1.5;
  }

  .option-btn:hover:not(:disabled) {
    background: var(--option-hover);
    border-color: #3a3a50;
  }

  .option-btn:disabled { cursor: default; }

  .opt-letter {
    flex-shrink: 0;
    width: 26px;
    height: 26px;
    border-radius: 6px;
    background: var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Unbounded', sans-serif;
    font-size: 10px;
    font-weight: 700;
    color: var(--muted);
    transition: background 0.15s, color 0.15s;
    margin-top: 1px;
  }

  .opt-text { flex: 1; }

  .option-btn.correct {
    background: var(--success-bg);
    border-color: var(--success-border);
  }
  .option-btn.correct .opt-letter {
    background: var(--success-border);
    color: var(--success-text);
  }
  .option-btn.correct .opt-text { color: var(--success-text); }

  .option-btn.wrong {
    background: var(--fail-bg);
    border-color: var(--fail-border);
  }
  .option-btn.wrong .opt-letter {
    background: var(--fail-border);
    color: var(--fail-text);
  }
  .option-btn.wrong .opt-text { color: var(--fail-text); }

  .option-btn.reveal {
    background: var(--success-bg);
    border-color: var(--success-border);
    opacity: 0.7;
  }
  .option-btn.reveal .opt-letter {
    background: var(--success-border);
    color: var(--success-text);
  }
  .option-btn.reveal .opt-text { color: var(--success-text); }

  .explanation {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-left: 3px solid var(--accent);
    border-radius: var(--radius);
    padding: 14px 18px;
    font-size: 13px;
    line-height: 1.7;
    color: #ccc8be;
    margin-bottom: 1.5rem;
    display: none;
  }
  .explanation.show { display: block; }
  .explanation strong { color: var(--accent2); font-weight: 500; }

  .actions {
    display: flex;
    justify-content: flex-end;
  }

  .btn-next {
    font-family: 'Unbounded', sans-serif;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.06em;
    padding: 12px 28px;
    background: var(--accent);
    color: #0e0e11;
    border: none;
    border-radius: var(--radius);
    cursor: pointer;
    display: none;
    transition: background 0.15s, transform 0.1s;
  }
  .btn-next:hover { background: var(--accent2); }
  .btn-next:active { transform: scale(0.97); }
  .btn-next.show { display: block; }

  .finish-screen {
    display: none;
    text-align: center;
    padding: 3rem 1rem;
  }
  .finish-screen.show { display: block; }

  .finish-icon {
    font-size: 48px;
    margin-bottom: 1.5rem;
  }

  .finish-title {
    font-family: 'Unbounded', sans-serif;
    font-size: 20px;
    font-weight: 700;
    color: var(--accent);
    margin-bottom: 0.75rem;
  }

  .finish-sub {
    font-size: 15px;
    color: var(--muted);
    margin-bottom: 0.5rem;
  }

  .finish-score {
    font-family: 'Unbounded', sans-serif;
    font-size: 42px;
    font-weight: 700;
    color: var(--text);
    margin: 1.5rem 0;
  }

  .finish-score span { color: var(--accent); }

  .btn-restart {
    font-family: 'Unbounded', sans-serif;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.08em;
    padding: 14px 36px;
    background: transparent;
    color: var(--accent);
    border: 1.5px solid var(--accent);
    border-radius: var(--radius);
    cursor: pointer;
    margin-top: 1rem;
    transition: background 0.15s, color 0.15s;
  }
  .btn-restart:hover { background: var(--accent); color: #0e0e11; }
</style>
</head>
<body>
<div class="shell">
  <div id="quiz-ui">
    <div class="header">
      <div class="header-title">История Казахстана</div>
      <div class="score-badge">Верно: <span id="score-disp">0</span> / <span id="total-disp">0</span></div>
    </div>
    <div class="progress-track"><div class="progress-fill" id="prog"></div></div>
    <div class="question-card">
      <div class="q-num" id="q-num"></div>
      <div class="q-text" id="q-text"></div>
    </div>
    <div class="options-grid" id="opts"></div>
    <div class="explanation" id="expl"></div>
    <div class="actions">
      <button class="btn-next" id="btn-next" onclick="nextQ()">Следующий →</button>
    </div>
  </div>
  <div class="finish-screen" id="finish">
    <div class="finish-icon">★</div>
    <div class="finish-title">Квиз завершён!</div>
    <div class="finish-sub">Вы ответили на все вопросы</div>
    <div class="finish-score"><span id="fs-score">0</span> / <span id="fs-total">0</span></div>
    <div class="finish-sub" id="fs-msg"></div>
    <button class="btn-restart" onclick="restart()">Пройти заново</button>
  </div>
</div>

<script>
const ALL = [
  {q:"Что является предметом исторической науки в Казахстане?",a:1,opts:["Изучение природных ресурсов Казахстана","Изучение закономерностей развития казахского общества, государства, культуры и народа","Анализ современной экономики республики","Исследование географических особенностей территории"],e:"Историческая наука изучает закономерности развития казахского общества и государства, процессы формирования народа, его культуры, хозяйства и политической жизни."},
  {q:"Какой метод исторической науки предполагает изучение событий в их хронологической последовательности?",a:0,opts:["Хронологический метод","Системный метод","Статистический метод","Сравнительно-исторический метод"],e:"Хронологический метод позволяет рассматривать исторические события в их временной последовательности, выявляя причинно-следственные связи."},
  {q:"Что изучает источниковедение как научная дисциплина?",a:2,opts:["Биографии исторических деятелей","Историю изучения прошлого учёными","Виды и методы работы с историческими источниками","Хронологию исторических эпох"],e:"Источниковедение — дисциплина, изучающая виды исторических источников (летописи, документы, артефакты) и методы работы с ними."},
  {q:"К какому периоду относится палеолит на территории Казахстана?",a:3,opts:["XII–VII тыс. до н. э.","VII–IV тыс. до н. э.","II тыс. до н. э.","От 1 млн до 12 тыс. лет назад"],e:"Палеолит на территории Казахстана охватывает период от 1 млн до 12 тыс. лет назад. Стоянки найдены на Мангышлаке и в Южном Казахстане."},
  {q:"Что характерно для мезолита на территории Казахстана?",a:0,opts:["Появление лука и стрелы, микролитических орудий, приручение собаки","Возникновение поливного земледелия","Начало добычи металлов","Строительство городских поселений"],e:"В мезолите (XII–VII тыс. до н. э.) появились лук и стрелы, микролитические орудия, началось приручение животных (собака)."},
  {q:"Что называют «неолитической революцией»?",a:1,opts:["Изобретение металлургии","Переход к производящему хозяйству — скотоводству и земледелию","Появление первых государств","Изобретение колеса и письменности"],e:"«Неолитическая революция» (VII–IV тыс. до н. э.) — переход от присваивающего хозяйства к производящему: скотоводству и земледелию. Появились керамика и ткачество."},
  {q:"Какие металлы добывались в Казахстане в эпоху бронзового века?",a:2,opts:["Железо, золото, серебро","Олово, свинец, золото","Медь, олово, свинец","Железо, медь, бронза"],e:"В горнодобывающих центрах Центрального и Восточного Казахстана (Жезказган и др.) добывали медь, олово и свинец для производства бронзы."},
  {q:"Какова хронология Андроновской культуры в Казахстане?",a:0,opts:["XVI–VIII вв. до н. э.","X–V вв. до н. э.","II–I тыс. до н. э.","VIII–III вв. до н. э."],e:"Андроновская культура датируется XVI–VIII вв. до н. э. Этапы: фёдоровский (XVI–XII вв.) и алексеевский (XII–VIII вв. до н. э.)."},
  {q:"Какой характер носила Андроновская культура?",a:1,opts:["Кочевой скотоводческий","Оседло-скотоводческий с элементами земледелия","Исключительно земледельческий","Торгово-ремесленный городской"],e:"Андроновская культура была оседло-скотоводческой с элементами земледелия, развитой бронзовой металлургией и характерным геометрическим орнаментом на керамике."},
  {q:"Кто такие саки?",a:2,opts:["Тюркоязычные кочевники II в. до н. э.","Монголоязычные племена Центральной Азии","Ираноязычные кочевые племена VIII–III вв. до н. э.","Оседлые земледельцы долины Сырдарьи"],e:"Саки — ираноязычные кочевые племена VIII–III вв. до н. э. Расселялись от Причерноморья до Восточного Казахстана, делились на несколько групп."},
  {q:"Как называется знаменитый погребальный памятник сакской культуры, обнаруженный близ Алматы?",a:0,opts:["Иссыкский курган («Золотой человек»)","Пазырыкский курган","Бесшатырский некрополь","Курган Аржан"],e:"Иссыкский курган, открытый в 1969 г., содержал погребение сакского воина в золотых украшениях — «Золотой человек», ставший символом сакской культуры."},
  {q:"Какова социальная структура сакского общества?",a:3,opts:["Двухкастовая: воины и земледельцы","Четырёхсословная по индийскому образцу","Равноправное родоплеменное общество","Трёхчленная: жрецы, воины, скотоводы/земледельцы"],e:"Саки имели трёхчленную социальную структуру: жрецы (белый цвет), воины (красный), скотоводы и земледельцы (жёлтый/синий)."},
  {q:"Где располагалась столица государства усуней?",a:1,opts:["Отрар","Чигучен (Красная долина)","Тараз","Суяб"],e:"Столица усуньского государства — Чигучен (Красная долина) располагалась в Семиречье. Усуни существовали со II в. до н. э. по V в. н. э."},
  {q:"На каком пути располагалось государство Канглов (Кангюй)?",a:2,opts:["На Великом степном пути","На Янтарном пути","На Великом Шёлковом пути","На Пути из варяг в греки"],e:"Государство Канглов (III в. до н. э. – IV в. н. э.) располагалось в бассейне Сырдарьи, через которую проходил Великий Шёлковый путь."},
  {q:"Кто основал первую степную империю в Центральной Азии?",a:0,opts:["Хунну (III в. до н. э.)","Саки (VIII в. до н. э.)","Тюрки (VI в. н. э.)","Монголы (XIII в. н. э.)"],e:"Хунну создали первую степную империю в III в. до н. э. под руководством шаньюя Модэ. Их государство простиралось от Маньчжурии до Средней Азии."},
  {q:"Каков принцип организации гуннской армии?",a:1,opts:["Фаланговый строй пешей пехоты","Десятичный принцип: десятки, сотни, тысячи, тьмы","Кастовая система наёмных воинов","Городские гарнизоны и крепостные отряды"],e:"Армия гуннов делилась по десятичному принципу: десятки, сотни, тысячи и тьмы (10 000). Основа — стремительная конница с составным луком."},
  {q:"Когда началось Великое переселение народов, связанное с движением гуннов на запад?",a:2,opts:["I–II вв. н. э.","II–III вв. н. э.","IV–V вв. н. э.","VI–VII вв. н. э."],e:"В IV–V вв. н. э. гунны под руководством Аттилы двинулись на запад, спровоцировав Великое переселение народов и крах Западной Римской империи в 476 г."},
  {q:"В каком году был основан Великий Тюркский каганат?",a:0,opts:["552 г. н. э.","603 г. н. э.","630 г. н. э.","740 г. н. э."],e:"Великий Тюркский каганат основан Бумыном-каганом в 552 г. н. э. В 603 г. распался на Восточный и Западный каганаты."},
  {q:"Кто стоял во главе Тюркского каганата?",a:3,opts:["Шаньюй из рода Хунну","Джабгу из племени огузов","Гуньмо из рода усуней","Каган из рода Ашина"],e:"Во главе Тюркского каганата стоял каган из рода Ашина. Ябгу, шад и тегины — представители правящего рода. Беги — родовая аристократия."},
  {q:"Как называются орхонские рунические памятники VIII в.?",a:1,opts:["Стела Чингисхана, Тамерлана, Токтамыша","Стелы Кюльтегина, Тоньюкука, Бильге-кагана","Таблички Отрара, Суяба, Баласагуна","Летописи Абулгазы, Рашид ад-Дина, Джувейни"],e:"Стела Кюльтегина (732 г.), Стела Тоньюкука и Стела Бильге-кагана (735 г.) написаны орхонским руническим алфавитом и являются важнейшими памятниками тюркской письменности."},
  {q:"Что такое «Он ок будун» в Западно-тюркском каганате?",a:2,opts:["Название столицы каганата","Титул верховного правителя","«Десять стрел» — два крыла из десяти племён","Тюркский военный отряд численностью 10 000 воинов"],e:"«Он ок будун» — «народ десяти стрел». Каганат делился на два крыла: Дулу (пять племён) и Нушиби (пять племён). Управлялись своими ябгу."},
  {q:"Какое событие произошло при Тюргешском каганате в 751 г.?",a:0,opts:["Битва при Атлахе — остановка арабского завоевания","Основание Великого Шёлкового пути","Принятие ислама тюргешами","Распад каганата под ударами карлуков"],e:"В 751 г. в битве при Атлахе тюргеши совместно с карлуками остановили арабское наступление. Это стало поворотным моментом в истории Средней Азии."},
  {q:"Что являлось собственной монетой Тюргешского каганата?",a:1,opts:["Золотые динары арабского образца","Тюргешские медные монеты","Серебряные дирхемы Самарканда","Китайские бронзовые монеты"],e:"Тюргеши чеканили собственные медные монеты — тюргешские монеты, что свидетельствует о развитой торговле и государственности."},
  {q:"Когда карлуки создали своё государство?",a:3,opts:["603 г. н. э.","699 г. н. э.","840 г. н. э.","После 756 г. н. э."],e:"После 756 г. карлуки разгромили тюргешей и создали государство в Семиречье. В 840 г. они победили уйгуров, усилив своё положение."},
  {q:"Где располагалась столица Огузского государства?",a:2,opts:["Тараз","Суяб","Янгикент","Баласагун"],e:"Столица Огузского государства (IX–XI вв.) — Янгикент, располагалась в низовьях Сырдарьи. Правитель носил титул джабгу."},
  {q:"Каким памятником культуры известны огузы?",a:0,opts:["Эпос «Книга Деда Коркута»","Поэма «Кутадгу билиг»","Трактат «О взглядах жителей добродетельного города»","Рунические надписи Орхона"],e:"«Книга Деда Коркута» — великий эпос огузского народа, памятник тюркской литературы. Огузы — предки туркмен, турок и азербайджанцев."},
  {q:"Когда было основано государство Карахани-дов?",a:1,opts:["756 г.","940 г.","999 г.","1212 г."],e:"Государство Карахани-дов было основано около 940 г. на базе карлуков и ягма. Это было первое исламское тюркское государство."},
  {q:"Кто написал «Кутадгу билиг» («Благодатное знание»)?",a:3,opts:["Аль-Фараби","Улугбек","Рашид ад-Дин","Жусуп Баласагуни"],e:"«Кутадгу билиг» («Благодатное знание», 1069 г.) — произведение Жусупа Баласагуни, тюркская энциклопедия мудрости и этики, написанная при Карахани-дах."},
  {q:"Где располагался центр Кимакского каганата?",a:0,opts:["На Иртыше и в Западной Сибири","В Семиречье","В низовьях Сырдарьи","На Волге и Урале"],e:"Кимакский каганат (IX–XI вв.) располагался на Иртыше и в Западной Сибири. Распался под давлением кипчаков в XI в."},
  {q:"Как называлась обширная степная территория расселения кипчаков?",a:2,opts:["Моголистан","Ак Орда","Дешт-и-Кипчак","Джучи улус"],e:"«Дешт-и-Кипчак» — «Кипчакская степь» — огромная территория от Иртыша до Дуная, где расселялись кипчаки (XI–XIII вв.)."},
  {q:"Кем были кипчаки в Египте?",a:1,opts:["Торговыми посредниками","Мамлюками — военной элитой","Религиозными деятелями","Дипломатическими послами"],e:"Часть кипчаков стала мамлюками — военной элитой в Египте. Кипчаки служили также в армиях Грузии, Венгрии и других государств."},
  {q:"На основе каких народов сложился казахский народ?",a:0,opts:["Сакских, усуньских, тюркских, кипчакских и монгольских компонентов","Исключительно тюркских и персидских племён","Монгольских и китайских племён","Славянских и тюркских народов"],e:"Казахский народ сложился на основе сакских, усуньских, канглыйских, тюркских, огузских, кипчакских и монгольских компонентов в XIV–XV вв."},
  {q:"Что означает этноним «қазақ»?",a:3,opts:["«Степной воин»","«Кочевник с луком»","«Защитник рода»","«Вольный человек», «скиталец»"],e:"Этноним «қазақ» появляется в источниках с XV в. и означает «вольный человек», «скиталец». Консолидация связана с образованием Казахского ханства."},
  {q:"Какие племена входят в Старший жуз?",a:0,opts:["Уйсун, Дулат, Джалаир","Аргын, Найман, Кипчак","Алшын, Байулы, Жетыру","Кереит, Найман, Меркит"],e:"Старший жуз (Семиречье) включает племена Уйсун, Дулат, Джалаир и другие. Средний жуз — Аргын, Найман, Кипчак. Младший — Алшын."},
  {q:"Кто основал Казахское ханство около 1465 г.?",a:1,opts:["Бурундык и Касым","Керей и Жанибек","Акназар и Есим","Тауке и Абылай"],e:"Около 1465 г. ханы Керей и Жанибек откочевали из ханства Абулхаира в Моголистан и основали Казахское ханство. Первая столица — Созак."},
  {q:"При каком хане территория Казахского ханства достигла около 1 млн кв. км?",a:2,opts:["При Керее","При Бурундыке","При Касым-хане","При Тауке-хане"],e:"Касым-хан (1511–1521) значительно расширил территорию до 1 млн кв. км, а численность населения возросла до 1 млн человек."},
  {q:"Что такое «Жеті жарғы»?",a:0,opts:["Свод обычного права казахов, принятый при Тауке-хане","Военный устав казахских батыров","Дипломатический договор с Россией","Торговый кодекс Шёлкового пути"],e:"«Жеті жарғы» («Семь уложений») — свод обычного права, принятый при Тауке-хане с участием биев Толе-би, Қазыбек-би и Айтеке-би. Регулировал все стороны казахской жизни."},
  {q:"Как называется период 1723–1727 гг. в казахской истории?",a:3,opts:["«Великий джут»","«Год чёрного бедствия»","«Эпоха смуты»","«Ақтабан шұбырынды» — «великое бедствие»"],e:"«Ақтабан шұбырынды» (1723–1727) — массовое джунгарское вторжение, крупнейшая катастрофа в истории казахов. В 1728 г. казахи одержали победу при Аныракае."},
  {q:"В каком году хан Абулхаир принял российское подданство?",a:1,opts:["1725 г.","1731 г.","1740 г.","1798 г."],e:"10 октября 1731 г. часть старшин Младшего жуза во главе с Абулхаиром приняла российское подданство. Это было вынужденной мерой перед джунгарской угрозой."},
  {q:"Каков главный итог деятельности Абылай-хана?",a:2,opts:["Полное освобождение от российского влияния","Создание письменного свода законов","Объединение большинства казахских племён, лавирование между Россией и Китаем","Разгром Джунгарского ханства в одиночку"],e:"Абылай-хан (1711–1781) объединил большинство казахских племён, был искусным дипломатом между Россией и Китаем. В 1771 г. провозглашён ханом трёх жузов."},
  {q:"Что установил Устав сибирских казахов 1822 года?",a:0,opts:["Ликвидацию ханской власти в Среднем жузе и деление на округа","Самоуправление казахов на основе обычного права","Создание казахского автономного государства","Полное равноправие казахов и русских переселенцев"],e:"Устав 1822 г. (разработан М. М. Сперанским) ликвидировал ханскую власть в Среднем жузе, ввёл деление на округа, волости, аулы и российский суд."},
  {q:"Кто возглавил крупнейшее восстание казахов 1837–1847 гг.?",a:3,opts:["Сырым Датов","Исатай Тайманов","Амангельды Иманов","Кенесары Касымов"],e:"Кенесары Касымов (внук Абылай-хана) возглавил восстание 1837–1847 гг. — крупнейшее в истории Казахстана. Стремился восстановить независимое ханство. Признан национальным героем."},
  {q:"Каковы основные цели переселенческой политики царизма в Казахстане?",a:1,opts:["Помощь голодающим казахам","Заселение «пустующих» земель русскими крестьянами и усиление колониального контроля","Создание совместных хозяйств","Распространение православия"],e:"Переселенческая политика (1891–1916) преследовала цели: заселение степи русскими крестьянами, снятие земельного голода в России, укрепление колониального контроля. У казахов изымались лучшие пастбища."},
  {q:"Что послужило поводом для восстания 1916 года?",a:2,opts:["Повышение налогов","Разрушение мечетей","Указ о мобилизации «инородцев» на тыловые работы","Запрет кочевания"],e:"Указ от 25 июня 1916 г. о призыве «инородцев» на тыловые работы вызвал восстание по всему Казахстану и Средней Азии. Лидеры: Амангельды Иманов, Алибек Джангильдин."},
  {q:"Кто является основателем партии «Алаш»?",a:0,opts:["Алихан Букейханов","Миржакип Дулатов","Мухамеджан Сералин","Ахмет Байтурсынов"],e:"Партия «Алаш» (1917) создана под руководством Алихана Букейханова — депутата I Государственной Думы. Программа: автономия Казахстана, земельное равноправие, демократия."},
  {q:"Что представлял из себя журнал «Айкап»?",a:3,opts:["Орган партии «Алаш»","Официальный вестник Временного правительства","Газета большевиков Казахстана","Либерально-демократический журнал Мухамеджана Сералина (1911–1915)"],e:"«Айкап» (1911–1915) — журнал либерально-демократического направления под редакцией Мухамеджана Сералина. Один из первых органов казахской периодической печати."},
  {q:"Когда была образована Казахская АССР?",a:1,opts:["1917 г.","26 августа 1920 г.","1922 г.","1925 г."],e:"26 августа 1920 г. образована Киргизская (Казахская) АССР в составе РСФСР со столицей в Оренбурге. В 1925 г. переименована в Казахскую АССР."},
  {q:"Каковы были главные последствия голода 1931–1933 гг. в Казахстане?",a:2,opts:["Небольшой экономический спад","Приход к власти новых лидеров","Гибель 1,5–2 млн казахов (около 40% населения), массовая эмиграция","Полное уничтожение городской жизни"],e:"Голод 1931–1933 гг. стал следствием насильственной коллективизации. Погибло от 1,5 до 2 млн казахов (~40% населения). Около 1 млн бежало в Китай, Монголию и другие республики."},
  {q:"Что такое Карлаг?",a:0,opts:["Карагандинский исправительно-трудовой лагерь (1931–1959)","Казахстанский разведывательный лагерь","Карагандинский артиллерийский лагерь","Казахский ресурсный лагерь"],e:"Карлаг (Карагандинский ИТЛ, 1931–1959) — один из крупнейших лагерей ГУЛАГа. АЛЖИР («Акмолинский лагерь жён изменников Родины») — лагерь для жён «врагов народа»."},
  {q:"Сколько казахстанцев было мобилизовано в годы Великой Отечественной войны?",a:3,opts:["200 000","500 000","800 000","Около 1,2 млн"],e:"Казахстан мобилизовал около 1,2 млн солдат. Более 500 казахстанцев стали Героями Советского Союза. Среди них — Бауыржан Момышулы, Алия Молдагулова, Маншук Маметова."},
  {q:"Какие народы были депортированы в Казахстан в годы войны?",a:1,opts:["Только поволжские немцы","Корейцы, поволжские немцы, чеченцы и ингуши, балкарцы, крымские татары","Только украинцы и белорусы","Польские и венгерские военнопленные"],e:"В Казахстан депортированы: корейцы (1937), поволжские немцы (1941), чеченцы и ингуши (1944), балкарцы, крымские татары и другие — всего около 1,5 млн человек."},
  {q:"Каковы были причины освоения целинных земель в 1954 г.?",a:2,opts:["Перенаселённость Казахстана","Необходимость создания рабочих мест для казахов","Нехватка зерна в СССР и политика Хрущёва","Просьба казахского правительства"],e:"Хрущёв начал кампанию по освоению целины (1954–1960) для решения проблемы нехватки зерна в СССР. В Северном Казахстане освоено 25–28 млн га. Это изменило демографический состав региона."},
  {q:"Что произошло в Алматы 17–18 декабря 1986 г.?",a:0,opts:["Выступление казахской молодёжи против назначения Колбина вместо Кунаева","Торжественное открытие Азиатских игр","Подписание договора о суверенитете КазССР","Первые многопартийные выборы"],e:"Декабрьские события 1986 г. — выступление казахской молодёжи против назначения Г. В. Колбина (русского) первым секретарём ЦК вместо Кунаева. Жестоко подавлено. Сегодня оценивается как акт национально-освободительной борьбы."},
  {q:"Когда был принят Закон о государственной независимости Республики Казахстан?",a:3,opts:["25 октября 1990 г.","8 декабря 1991 г.","21 декабря 1991 г.","16 декабря 1991 г."],e:"16 декабря 1991 г. принят Закон «О государственной независимости Республики Казахстан». День независимости — 16 декабря."},
  {q:"Когда был введён казахстанский тенге?",a:1,opts:["1991 г.","15 ноября 1993 г.","1 января 1995 г.","1997 г."],e:"15 ноября 1993 г. введён тенге, заменивший советские рубли. Это позволило Казахстану проводить самостоятельную денежно-кредитную политику."},
  {q:"В каком году столица Казахстана перенесена в Акмолу (Астану)?",a:2,opts:["1993 г.","1995 г.","1997–1998 гг.","2001 г."],e:"10 декабря 1997 г. столица официально перенесена в Акмолу, в 1998 г. переименованную в Астану. В 2019 г. — Нур-Султан, в 2022 г. возвращено название Астана."},
  {q:"Кто основал Академию наук Казахской ССР?",a:0,opts:["Канышем Сатпаевым в 1946 г.","Мухтаром Ауэзовым в 1940 г.","Алиханом Букейхановым в 1920 г.","Динмухамедом Кунаевым в 1960 г."],e:"Академия наук КазССР основана в 1946 г. Первым президентом стал выдающийся учёный-геолог Каныш Сатпаев."},
  {q:"Когда была основана Ассамблея народа Казахстана (АНК)?",a:3,opts:["1991 г.","1993 г.","2002 г.","1995 г."],e:"АНК основана в 1995 г. по инициативе Назарбаева. Консультативно-совещательный орган при Президенте, представляющий 40+ этнических и культурных объединений."},
  {q:"Чьей инициативой является идея Евразийского союза?",a:1,opts:["Владимира Путина","Нурсултана Назарбаева (1994 г.)","Александра Лукашенко","Михаила Горбачёва"],e:"Идею Евразийского союза выдвинул Нурсултан Назарбаев в 1994 г. в речи в МГУ. В 2015 г. создан ЕАЭС (Казахстан, Россия, Беларусь, Армения, Кыргызстан)."},
  {q:"Каков был главный тезис Послания Токаева 2019 года?",a:2,opts:["Экономическое развитие и диверсификация","Переход к парламентской республике","Конструктивный диалог — основа стабильности и процветания","Безъядерный статус Казахстана"],e:"Послание Токаева от 2 сентября 2019 г.: «Конструктивный общественный диалог — основа стабильности и процветания». Акцент на слышащем государстве и противодействии коррупции."},
  {q:"Что изучал Шокан Уалиханов во время путешествия в Кашгарию (1858–1859)?",a:0,opts:["Географию, этнографию Средней Азии, записал части эпоса «Манас»","Военное дело монгольских племён","Торговые пути Персии","Месторождения золота и железа"],e:"Шокан Уалиханов (1835–1865) в ходе тайной экспедиции в Кашгарию собрал материалы по географии, этнографии, истории. Записал фрагменты эпоса «Манас». Был другом Ф. М. Достоевского."},
  {q:"Кем является Абай Кунанбаев?",a:3,opts:["Полководцем, победившим джунгар","Первым президентом независимого Казахстана","Создателем казахского алфавита на основе кириллицы","Основоположником казахской письменной литературы, поэтом и просветителем"],e:"Абай (1845–1904) — основоположник казахской письменной литературы. «Слова назидания», переводы Пушкина и Лермонтова. Его философия: просвещение, нравственность, знание."},
  {q:"Что создал Ибрай Алтынсарин?",a:1,opts:["Первый казахский театр","Первые казахские школы и учебники, казахский алфавит на основе русской графики","Свод казахского обычного права","Казахскую академию наук"],e:"Алтынсарин (1841–1889) создал первые казахские школы в степи, разработал казахский алфавит на основе русской графики, написал учебники и детские рассказы."},
  {q:"Что добыли на Байконуре в 1957 году?",a:2,opts:["Первые нефтяные скважины Казахстана","Крупнейшее урановое месторождение","Запустили первый в мире искусственный спутник Земли","Открыли крупнейший угольный разрез"],e:"В 1957 г. с космодрома Байконур запущен первый искусственный спутник Земли. В 1961 г. — полёт Юрия Гагарина. Байконур стал главным космическим центром СССР."},
  {q:"Каковы главные экологические последствия Аральской катастрофы?",a:0,opts:["Обмеление моря на 20+ м, гибель рыболовства, засоление почв, климатические изменения","Временное обмеление с последующим восстановлением","Только экономические потери рыболовной отрасли","Загрязнение воздуха промышленными предприятиями"],e:"С 1960-х гг. забор воды из Амударьи и Сырдарьи для орошения хлопка обрушил уровень Арала на 20+ м, уничтожил рыболовство, засолил почвы и изменил местный климат."},
  {q:"Что такое программа «Болашак»?",a:3,opts:["Программа промышленного развития","Экологическая программа восстановления Арала","Программа по развитию национального языка","Государственная программа зарубежных стипендий для казахстанской молодёжи (с 1993 г.)"],e:"«Болашак» («Будущее») — государственная программа зарубежных стипендий, действующая с 1993 г. Тысячи казахстанцев получили образование в ведущих университетах мира."},
  {q:"Какова тема ЭКСПО-2017 в Астане?",a:1,opts:["«Технологии и общество»","«Энергия будущего»","«Вода — жизнь планеты»","«Мир без границ»"],e:"ЭКСПО-2017 в Астане прошло под темой «Энергия будущего» (10 июня – 10 сентября 2017 г.). 115 стран-участниц. После выставки создан Международный финансовый центр «Астана»."},
  {q:"Чем была примечательна Конституция Казахстана 1995 года?",a:2,opts:["Провозгласила парламентскую форму правления","Закрепила советскую систему управления","Закрепила президентскую республику, унитарное государство, рыночную экономику","Ввела федеративное устройство с широкими правами регионов"],e:"Конституция 1995 г. (принята на референдуме 30 августа) закрепила президентскую форму правления, унитарное государство и рыночную экономику. Поправки 2022 г. расширили полномочия парламента."},

];

let qs = [], cur = 0, score = 0, chosen = false;

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function start(){
  qs = shuffle([...ALL]);
  cur = 0; score = 0; chosen = false;
  document.getElementById('finish').classList.remove('show');
  document.getElementById('quiz-ui').style.display = '';
  render();
}

function render(){
  const q = qs[cur];
  document.getElementById('q-num').textContent = `Вопрос ${cur+1} из ${qs.length}`;
  document.getElementById('q-text').textContent = q.q;
  document.getElementById('prog').style.width = (cur/qs.length*100)+'%';
  document.getElementById('score-disp').textContent = score;
  document.getElementById('total-disp').textContent = cur;
  document.getElementById('expl').className = 'explanation';
  document.getElementById('expl').innerHTML = '';
  document.getElementById('btn-next').classList.remove('show');
  chosen = false;

  const letters = ['А','Б','В','Г'];
  const optCopy = [...q.opts];
  const opts = document.getElementById('opts');
  opts.innerHTML = '';
  optCopy.forEach((txt, i) => {
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.dataset.idx = i;
    btn.innerHTML = `<span class="opt-letter">${letters[i]}</span><span class="opt-text">${txt}</span>`;
    btn.onclick = () => pick(i, q.a, q.e);
    opts.appendChild(btn);
  });
}

function pick(idx, correct, expl){
  if(chosen) return;
  chosen = true;
  const btns = document.querySelectorAll('.option-btn');
  btns.forEach(b => b.disabled = true);
  const sel = btns[idx];
  if(idx === correct){
    sel.classList.add('correct');
    score++;
    document.getElementById('score-disp').textContent = score;
  } else {
    sel.classList.add('wrong');
    btns[correct].classList.add('reveal');
  }
  const ex = document.getElementById('expl');
  ex.innerHTML = '<strong>Пояснение:</strong> ' + expl;
  ex.classList.add('show');
  document.getElementById('btn-next').classList.add('show');
}

function nextQ(){
  cur++;
  if(cur >= qs.length){
    document.getElementById('quiz-ui').style.display = 'none';
    const f = document.getElementById('finish');
    f.classList.add('show');
    document.getElementById('fs-score').textContent = score;
    document.getElementById('fs-total').textContent = qs.length;
    const pct = Math.round(score/qs.length*100);
    let msg = pct >= 80 ? 'Отлично! Вы хорошо знаете историю Казахстана.' : pct >= 50 ? 'Неплохо! Есть над чем поработать.' : 'Стоит повторить материал. Попробуйте ещё раз!';
    document.getElementById('fs-msg').textContent = msg;
    return;
  }
  render();
}

function restart(){ start(); }

start();
</script>
